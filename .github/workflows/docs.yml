name: Publicar documentación

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install "zensical==0.1.2"
      - run: zensical build
      - name: Validar documentación, sintaxis Bash y reversión de cambios en el host
        run: python3 scripts/validar.py
      - name: Instalar herramientas de prueba de red
        run: sudo apt-get update && sudo apt-get install -y iproute2 iputils-ping nftables iptables dnsmasq-base isc-dhcp-client dnsutils keepalived
      - name: Pruebas funcionales de L2/FDB, routing, firewall, VLAN 802.1Q, GRE, IPsec, DHCP/DNS, VRRP, continuidad y reversión del host
        run: sudo env RUNNER_TEMP="$RUNNER_TEMP" GITHUB_RUN_ID="$GITHUB_RUN_ID" bash scripts/pruebas_funcionales.sh
      - name: Guardar diagnóstico VRRP aunque fallen las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-vrrp-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/networking-lab-vrrp-*
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
