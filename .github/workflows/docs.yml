name: Validar y publicar documentación

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Evita acumular ejecuciones obsoletas cuando llegan varios commits seguidos.
# Una ejecución nueva de la misma referencia cancela la anterior.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Validar y construir documentación
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias de documentación
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
        timeout-minutes: 5

      - name: Validar estructura, enlaces, navegación y sintaxis
        run: python scripts/validar.py
        timeout-minutes: 2

      - name: Construir el sitio
        run: zensical build
        timeout-minutes: 5

      - name: Comprobar artefacto generado
        run: test -s site/index.html
        timeout-minutes: 1

      - name: Publicar artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar sitio
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 8
